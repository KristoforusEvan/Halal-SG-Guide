<body>
    <div id="header">
        <h1>Halal SG Guide - Profil Wisatawan</h1>
        <p>Kelola informasi pribadi akun wisata halal Anda</p>

    <div class="container">
        <h2>Lihat &amp; Update Profil Pengguna</h2>

        <div id="pesan"></div>

        <div class="card-form">
            <form id="formProfil" action="api/profil.php" method="post">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" />

                    <label for="email">Email</label>
                    <input type="text" id="email" name="email" />
                </div>
                <div class="form-group">
                    <label for="nama">Nama Lengkap (opsional)</label>
                    <input type="text" id="nama" name="nama" />
                </div>
                <div class="form-group">
                    <label for="asal_kota">Asal Kota (opsional)</label>
                    <input type="text" id="asal_kota" name="asal_kota" />
                </div>
                <div><input type="submit" class="btn" value="Simpan Perubahan Profil" /></div>
            </form>
        </div>
    </div>
