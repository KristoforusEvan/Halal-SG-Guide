<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="application/xhtml+xml; charset=UTF-8" />
    <title>Profil Pengguna - Halal SG Guide</title>
    <link rel="stylesheet" type="text/css" href="css/style.css?v=16" />
    <script type="text/javascript" src="js/umum.js?v=17"></script>
    <script type="text/javascript" src="js/validasi.js?v=17"></script>
    <script type="text/javascript" src="js/profil.js?v=17"></script>
</head>
<body>
    <div id="header">
        <h1>Halal SG Guide</h1>
        <p>Kelola informasi akun dan foto profil wisatawan Muslim Anda</p>
    </div>

    <div id="nav"></div>

    <div class="container">
        <div class="card-form">
            <h2>Lihat &amp; Update Profil Pengguna</h2>
            <div id="pesan"></div>

            <form id="formProfil" action="api/profil.php" method="post" enctype="multipart/form-data">
                <div class="profil-avatar-box">
                    <img id="previewFotoProfil" src="img/bg-singapore.jpg" alt="Foto Profil" class="profil-avatar-img" />
                    <div class="profil-avatar-input">
                        <label for="foto_profil">Foto Profil (JPG, PNG, atau WEBP - Maksimal 2 MB)</label>
                        <input type="file" id="foto_profil" name="foto_profil" accept="image/jpeg,image/png,image/webp" />
                        <p class="form-hint">Biarkan kosong jika tidak ingin mengganti foto profil saat ini.</p>
                    </div>
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" />
                    <p class="form-hint">3-30 karakter: huruf, angka, dan underscore (_).</p>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="text" id="email" name="email" />
                </div>

                <div class="form-group">
                    <label for="nama">Nama Lengkap (opsional)</label>
                    <input type="text" id="nama" name="nama" />
                </div>

                <div class="form-group">
                    <label for="asal_kota">Asal Kota (opsional)</label>
                    <input type="text" id="asal_kota" name="asal_kota" />
                </div>

                <input type="submit" value="Simpan Perubahan Profil" class="btn" />
            </form>
        </div>
    </div>
</body>
</html>
